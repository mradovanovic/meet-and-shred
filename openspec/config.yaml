# Source de vérité « produit » : CLAUDE.md à la racine. Source de vérité
# « décisions d'archi par change » : openspec/changes/<nom>/design.md.

schema: spec-driven

context: |
  # MeetNShred — Contexte projet

  Plateforme communautaire **multi-disciplines de ride** (mobile React Native
  Expo). Elle connecte les riders en temps réel autour des spots et des events.
  L'écran central est une carte Google Maps montrant ce qui se passe autour du
  rider (spots rideable, events, sessions). Fonctionnalité différenciante : le
  **swipe sur les events** pour rejoindre une session sans friction.

  Disciplines couvertes (liste ouverte, non exhaustive) : MX, DH, Enduro
  moto/VTT, Supermoto, Freeride, FMX, Moto piste/circuit, Kite, Wakeboard (boat
  et cable), Skateboard, Ski/Snow, DirtJump.

  ## Langue
  Langue de travail : **français**. Specs, proposals, designs, tasks, commits,
  discussions — tout est rédigé en français.

  ## Invariants d'architecture (NON négociables)
  - **Disciplines** : jamais un enum hardcodé. Table dédiée `disciplines` avec
    `equipment_schema JSONB`. Un spot couvre N disciplines (`spot_disciplines`),
    un rider en pratique N (`rider_disciplines`). Ajouter une discipline =
    insérer une ligne, jamais modifier le code. Toute archi qui hardcode MX/DH
    est une erreur.
  - **Statuts de spot** : définis dans des fichiers de config JSON
    `configs/spot-statuses/{discipline-slug}.json`, jamais en base, jamais de
    migration pour ajouter un statut. Chaque statut : `slug`, `color`,
    `label { fr, en, es }`, `visible_on_map`. Fallback sur statuts génériques
    (open/closed) si la config d'une discipline est absente.
  - **i18n** : toutes les données statiques (disciplines, statuts, types
    d'events) stockent leurs labels en objet multilingue `{ fr, en, es }`. Le
    contenu utilisateur (bios, descriptions, noms de spots) n'est PAS traduit
    automatiquement au MVP. Langues : FR (défaut), EN, ES.
  - **Photos** : profil rider max 5 (la 1ère = principale) ; setup matériel max 3
    par fiche (la 1ère = cover). Limite 5 MB/photo, compression côté serveur
    avant stockage. URLs en base, fichiers en object storage (S3 ou R2).

  ## Rôles utilisateurs
  - `rider` — compte standard.
  - `spot_manager` (nom TBD) — crée et gère des spots ; attribué par super admin.
  - `organisateur` — crée des sessions organisées sur les events.
  - `super_admin` — validation manuelle des spots, attribution des rôles.

  ## Stack
  - Mobile : React Native Expo (iOS + Android).
  - Auth : JWT stateless + refresh token, Google OAuth 2.0, Apple Sign-In.
  - API : REST (stack backend non finalisée — voir open questions des designs).
  - Base : PostgreSQL (JSONB pour schémas matériel et configs).
  - Stockage photos : S3 ou Cloudflare R2.
  - Cartes : Google Maps API. Push : FCM (Android) + APNs (iOS). i18n : i18next.

  ## Périmètre
  - **MVP** : auth-registration (avec RGPD : consentement, suppression de
    compte, export des données), rider-profile, spot-core (spots privés et
    publics), events-core, map-core, i18n-core, notifications-push (7 types,
    préférences par type incluses), backoffice-spot, rider-social (suivi
    libre entre riders, fil d'activité, messagerie directe), shop-core,
    sessions-core (sessions de ride créées librement par un rider, liées à
    un spot privé ou public, sans rôle ni capacité ni paiement),
    navigation-core (structure de navigation principale de l'app),
    reviews-core (avis sur spots/magasins/events), moderation-core
    (signalement de contenu).
  - **Phase 2** : calendrier d'ouvertures récurrentes.
  - **Phase 3** : paiement natif intégré, 2FA, messagerie gestionnaire↔rider.

  ## Workflow
  Spec-driven via OpenSpec : /opsx:propose → /opsx:apply → /opsx:archive.
  Ne pas implémenter sans passer par un change. Avant implémentation, les specs
  vivent en delta dans `changes/<nom>/specs/` ; elles n'atterrissent dans
  `openspec/specs/` qu'après archivage.
